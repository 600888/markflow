repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix, --unsafe-fixes]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^frontend/src/
        types_or: [javascript, jsx, typescript, tsx, css, json]

  - repo: local
    hooks:
      - id: eslint
        name: ESLint (frontend)
        entry: cmd /c "cd frontend && npx eslint --fix src/"
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false

      - id: pyrefly
        name: pyrefly (backend)
        entry: cmd /c "cd backend && pyrefly check ."
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
        types: [python]

      - id: pytest
        name: pytest (backend)
        entry: cmd /c "cd backend && pytest --cov=app --cov-report=term-missing -x"
        language: system
        files: ^backend/
        pass_filenames: false
        stages: [push]
