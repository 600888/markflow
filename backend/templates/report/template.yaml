name: "报告模版"
slug: "report"
version: "1.0.0"
description: "适合工作报告和技术文档，微软雅黑字体，1.25 倍行距，蓝色主题"
author: "MarkFlow"
target_formats: ["docx", "pdf"]

styles:
  heading1:
    font: "微软雅黑"
    size: "二号"
    bold: true
    color: "#2E75B6"
    space_before: "2 倍行距"
    space_after: "1.5 倍行距"
  heading2:
    font: "微软雅黑"
    size: "三号"
    bold: true
    color: "#2E75B6"
    space_before: "1.5 倍行距"
    space_after: "1 倍行距"
  heading3:
    font: "微软雅黑"
    size: "四号"
    bold: true
    color: "#404040"
    space_before: "1 倍行距"
    space_after: "0.5 倍行距"
  body:
    font: "微软雅黑"
    size: "五号"
    line_spacing: 1.25
  code:
    font: "Cascadia Code"
    size: "小五"
    background: "#F0F6FC"
