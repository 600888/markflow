name: "学术论文"
slug: "academic"
version: "1.0.0"
description: "符合中文学术论文排版规范（GB/T 7714），黑体标题、宋体正文、1.5 倍行距、首行缩进"
author: "MarkFlow"
target_formats: ["docx", "pdf"]

styles:
  heading1:
    font: "黑体"
    size: "三号"
    bold: true
    alignment: "center"
    space_before: "3 倍行距"
    space_after: "1.5 倍行距"
  heading2:
    font: "黑体"
    size: "四号"
    bold: true
    space_before: "2 倍行距"
    space_after: "1 倍行距"
  heading3:
    font: "黑体"
    size: "小四"
    bold: true
    space_before: "1.5 倍行距"
    space_after: "0.5 倍行距"
  body:
    font: "宋体"
    size: "小四"
    line_spacing: 1.5
    first_line_indent: "2 字符"
  code:
    font: "Consolas"
    size: "五号"
    background: "#F5F5F5"
  table:
    header_font: "黑体"
    header_size: "五号"
    header_bold: true
    header_background: "#E8E8E8"
    body_font: "宋体"
    body_size: "五号"
    border: "三线表"
    stripe_rows: true
