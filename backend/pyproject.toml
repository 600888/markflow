[project]
name = "markflow-backend"
version = "1.0.0"
description = "Markdown to Word/PDF/HTML conversion service"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pypandoc>=1.14",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0",
    "python-dotenv>=1.0.1",
    "aiofiles>=24.1.0",
    "loguru>=0.7.3",
    "pyyaml>=6.0",
    "playwright>=1.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "pyrefly>=0.1.0",
    "coverage>=7.6.0",
    "python-docx>=1.1",
    "pre-commit>=4.0.0",
]

[tool.setuptools.packages.find]
include = ["app*", "config*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203", "D212", "COM812",     # 不兼容的 pydocstyle 规则
    "RUF001", "RUF002", "RUF003", # 中文全角符号
    "TC001", "TC003",              # import 移入 type-checking 块（过度）
    "RUF012",                      # mutable class attrs (FORMAT_MAP dict)
    "ANN001",                      # 函数参数类型注解（mock 参数）
    "ARG002",                      # 未使用的参数（mock 参数）
    "D107",                        # __init__ 需要 docstring
    "D400", "D415",                # 中文 docstring 结尾句号
    "D104",                        # __init__.py 包 docstring
    "TRY003",                      # 异常消息过长
    "EM101", "EM102",              # 异常字符串必须赋值给变量（过度）
    "C901",                        # 函数复杂性（实用场景无需拆分）
    "PLR0911", "PLR0912",          # return/分支过多（实用场景可接受）
    "PLR0915",                     # 语句过多（预处理方法合理）

    "BLE001",                      # 盲目捕获 Exception（简化错误处理）
    "TRY300",                      # try 中 return（风格偏好）
    "PLC0415",                     # 函数内 import（可选依赖、延迟加载合理）
    "S603",                        # subprocess 执行当前 Python（sys.executable 可控）
]
per-file-ignores."tests/**" = [
    "D", "S101", "PLR2004", "PLC0415", "RUF012", "TC003", "ANN", "ARG",
    "FBT", "PT011", "PGH004", "T201",
]
per-file-ignores."**/conftest.py" = [
    "F401",
]
per-file-ignores."**/logger.py" = [
    "D", "ANN", "FBT", "ARG", "SIM", "PTH", "PLR", "PLC", "PLE", "PLW", "RET", "E501", "W292",
]
per-file-ignores."app/api/*.py" = [
    "D103", "ARG001", "PLW0603", "PLR0913", "B904", "PLC0415", "RUF006",
    "ANN202", "D101", "SIM105", "BLE001", "S110", "TC002",
]
per-file-ignores."app/services/converter.py" = [
    "F401", "TRY300", "S101",
]
per-file-ignores."app/core/engine.py" = [
    "N806", "SLF001", "C901", "PLR0912", "FBT001", "D301",
    "S603", "S607", "BLE001", "ANN202", "SIM105", "PLW1510",
    "ANN401", "ASYNC221", "ASYNC240",
]
per-file-ignores."app/core/template_manager.py" = [
    "C901",
]
per-file-ignores."app/core/file_manager.py" = [
    "ASYNC240",
]
per-file-ignores."app/core/mermaid_renderer.py" = [
    "ASYNC240",
]
per-file-ignores."app/core/browser_check.py" = [
    "ASYNC251",
]
per-file-ignores."scripts/generate_reference.py" = [
    "INP001", "D103", "D205", "D213", "PLR2004", "C901",
    "PLR0912", "PLR0915", "N806", "T201",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: 需要 Pandoc 的集成测试，不在常规 CI 中运行",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
