  <text x="993" y="349" font-family="Arial,'Microsoft YaHei'" font-size="17" font-weight="700" fill="#111827">1. 项目概述</text><text x="993" y="388" font-family="Arial,'Microsoft YaHei'" font-size="11" fill="#374151">MarkFlow 是一款专注于 Markdown 文档转换的桌面工具。</text><text x="993" y="409" font-family="Arial,'Microsoft YaHei'" font-size="11" fill="#374151">它提供稳定、清晰且一致的文档输出体验。</text><text x="993" y="454" font-family="Arial,'Microsoft YaHei'" font-size="14" font-weight="700" fill="#111827">1.1 核心能力</text><circle cx="1000" cy="480" r="2" fill="#7c3aed"/><text x="1012" y="484" font-family="Arial,'Microsoft YaHei'" font-size="11" fill="#374151">Markdown 转换为 DOCX 与 PDF</text><circle cx="1000" cy="510" r="2" fill="#7c3aed"/><text x="1012" y="514" font-family="Arial,'Microsoft YaHei'" font-size="11" fill="#374151">自定义标题、正文和表格样式</text>
  <rect x="993" y="545" width="320" height="92" rx="6" fill="#111827"/><text x="1010" y="570" font-family="monospace" font-size="10" fill="#d1fae5"># 转换文档</text><text x="1010" y="592" font-family="monospace" font-size="10" fill="#d1fae5">markflow convert report.md --template custom</text><text x="1090" y="675" font-family="Arial,'Microsoft YaHei'" font-size="9" fill="#6b7280">表 1  输出格式</text><rect x="993" y="688" width="320" height="28" fill="#f3e8ff" stroke="#d1d5db"/><text x="1010" y="706" font-family="Arial,'Microsoft YaHei'" font-size="9" font-weight="700" fill="#374151">格式                         用途</text><rect x="993" y="716" width="320" height="52" fill="#fff" stroke="#d1d5db"/><text x="1010" y="736" font-family="Arial,'Microsoft YaHei'" font-size="9" fill="#4b5563">DOCX                       正式文档</text><text x="1010" y="756" font-family="Arial,'Microsoft YaHei'" font-size="9" fill="#4b5563">PDF                           分发阅读</text>
